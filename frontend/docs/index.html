<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Zerith</title>
    <link rel="icon" href="favicon.ico" />

    <!-- Tailwind CSS (JIT via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel (JSX compiler) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .animate-spin-slow { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .animate-in { animation-duration: 0.5s; animation-fill-mode: forwards; }
        .fade-in { animation-name: fadeIn; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .slide-in-from-bottom-2 { animation-name: slideInBottom2; }
        @keyframes slideInBottom2 { from { opacity: 0; transform: translateY(0.5rem); } to { opacity: 1; transform: translateY(0); } }

        .slide-in-from-bottom-4 { animation-name: slideInBottom4; }
        @keyframes slideInBottom4 { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: translateY(0); } }

        .slide-in-from-bottom-8 { animation-name: slideInBottom8; }
        @keyframes slideInBottom8 { from { opacity: 0; transform: translateY(2rem); } to { opacity: 1; transform: translateY(0); } }

        .slide-in-from-bottom-10 { animation-name: slideInBottom10; }
        @keyframes slideInBottom10 { from { opacity: 0; transform: translateY(2.5rem); } to { opacity: 1; transform: translateY(0); } }

        .slide-in-from-top-2 { animation-name: slideInTop2; }
        @keyframes slideInTop2 { from { opacity: 0; transform: translateY(-0.5rem); } to { opacity: 1; transform: translateY(0); } }

        .zoom-in-95 { animation-name: zoomIn95; }
        @keyframes zoomIn95 { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .fill-mode-both { animation-fill-mode: both; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ── API ────────────────────────────────────────────────────────────────
        const API_BASE = 'https://api.zerithfrotas.tech/api/v1';

        function apiFetch(path, options = {}) {
          const { headers = {}, ...rest } = options;
          return fetch(`${API_BASE}${path}`, {
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', ...headers },
            ...rest,
          });
        }

        // ── Icon ───────────────────────────────────────────────────────────────
        const Icon = ({ name, size = 20, className = "" }) => (
            <i className={`ph-light ph-${name} ${className}`} style={{ fontSize: size }}></i>
        );

        // ── LoadingScreen ──────────────────────────────────────────────────────
        function LoadingScreen() {
          return (
            <div className="min-h-screen bg-gradient-to-br from-[#0f1422] via-[#151b28] to-[#1a2235] flex items-center justify-center">
              <div className="text-center">
                <div className="w-12 h-12 border-2 border-white/10 border-t-blue-500/60 rounded-full animate-spin mx-auto mb-6"></div>
                <p className="text-white/25 text-[10px] tracking-[0.45em] uppercase select-none">Zerith</p>
              </div>
            </div>
          );
        }

        // ── LoginScreen ────────────────────────────────────────────────────────
        function LoginScreen({ onLogin }) {
          const [email, setEmail] = useState('');
          const [senha, setSenha] = useState('');
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState('');

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError('');
            try {
              const res = await apiFetch('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ email, senha }),
              });
              const json = await res.json();
              if (res.ok && json.success) {
                onLogin(json.data);
              } else {
                setError(json.message || 'Credenciais inválidas.');
              }
            } catch {
              setError('Não foi possível conectar ao servidor.');
            } finally {
              setLoading(false);
            }
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-[#0f1422] via-[#151b28] to-[#1a2235] flex items-center justify-center p-4">
              <div className="w-full max-w-sm">
                <div className="text-center mb-10">
                  <p className="text-3xl font-light tracking-[0.35em] text-white select-none">ZERITH</p>
                  <p className="text-white/30 text-[10px] tracking-[0.2em] mt-2 uppercase">Gestão Inteligente de Frotas</p>
                </div>

                <form onSubmit={handleSubmit} className="bg-white/5 backdrop-blur-sm border border-white/10 rounded-[2rem] p-8 space-y-5">
                  {error && (
                    <div className="bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3 text-red-400 text-sm flex items-center gap-2">
                      <Icon name="warning-circle" size={16} className="shrink-0" />
                      {error}
                    </div>
                  )}
                  <div>
                    <label className="text-[10px] text-white/40 uppercase tracking-wider block mb-2">E-mail</label>
                    <input
                      type="email"
                      value={email}
                      onChange={e => setEmail(e.target.value)}
                      required
                      autoComplete="email"
                      placeholder="seu@email.com"
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-blue-500/50 focus:bg-white/10 transition-all"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] text-white/40 uppercase tracking-wider block mb-2">Senha</label>
                    <input
                      type="password"
                      value={senha}
                      onChange={e => setSenha(e.target.value)}
                      required
                      autoComplete="current-password"
                      placeholder="••••••••"
                      className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 text-sm focus:outline-none focus:border-blue-500/50 focus:bg-white/10 transition-all"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full h-12 bg-white text-[#0f1422] font-bold text-xs tracking-widest rounded-xl hover:bg-white/90 active:scale-95 transition-all disabled:opacity-40 disabled:cursor-not-allowed mt-2 flex items-center justify-center gap-2"
                  >
                    {loading
                      ? <><div className="w-4 h-4 border-2 border-[#0f1422]/20 border-t-[#0f1422] rounded-full animate-spin"></div>AUTENTICANDO</>
                      : 'ENTRAR'}
                  </button>
                </form>
              </div>
            </div>
          );
        }

        // ── App ────────────────────────────────────────────────────────────────
        function App() {
          // Auth
          const [authState, setAuthState] = useState('loading');
          const [currentUser, setCurrentUser] = useState(null);
          const [apiVehicles, setApiVehicles] = useState([]);
          const [telemetryData, setTelemetryData] = useState(null);

          // Navigation
          const [currentView, setCurrentView] = useState('dashboard');
          const [isUserMenuOpen, setIsUserMenuOpen] = useState(false);
          const [isSidebarOpen, setIsSidebarOpen] = useState(true);
          const [isNotifOpen, setIsNotifOpen] = useState(false);

          // Dashboard
          const [activeFilter, setActiveFilter] = useState('Todos');
          const [selectedVehicle, setSelectedVehicle] = useState(null);
          const [carouselIndex, setCarouselIndex] = useState(0);
          const [driverTab, setDriverTab] = useState('em_rota');
          const [isDarkMode, setIsDarkMode] = useState(false);
          const [resolvedIssues, setResolvedIssues] = useState([]);
          const [isSearchFocused, setIsSearchFocused] = useState(false);

          // ── Effects ────────────────────────────────────────────────────────

          useEffect(() => {
            apiFetch('/auth/me')
              .then(res => res.ok ? res.json() : Promise.reject())
              .then(json => { setCurrentUser(json.data); setAuthState('authenticated'); })
              .catch(() => setAuthState('unauthenticated'));
          }, []);

          useEffect(() => {
            if (authState !== 'authenticated') return;
            apiFetch('/veiculos')
              .then(res => res.ok ? res.json() : null)
              .then(json => {
                if (!json?.data?.length) return;
                setApiVehicles(json.data);
                const firstId = json.data[0].id;
                apiFetch(`/veiculos/${firstId}/telemetria/ultima`)
                  .then(r => r.ok ? r.json() : null)
                  .then(t => { if (t?.data) setTelemetryData(t.data); })
                  .catch(() => {});
              })
              .catch(() => {});
          }, [authState]);

          // ── Handlers ───────────────────────────────────────────────────────

          const handleLogin = (user) => { setCurrentUser(user); setAuthState('authenticated'); };

          const handleLogout = async () => {
            try { await apiFetch('/auth/logout', { method: 'POST' }); } catch {}
            setCurrentUser(null); setApiVehicles([]); setTelemetryData(null);
            setAuthState('unauthenticated');
          };

          const handleResolveIssue = (id) => { setResolvedIssues(prev => [...prev, id]); };

          // ── Theme ──────────────────────────────────────────────────────────

          const theme = {
            bg: isDarkMode ? 'bg-[#0f141e]' : 'bg-[#f5f7fa]',
            textMain: isDarkMode ? 'text-gray-100' : 'text-gray-800',
            textMuted: isDarkMode ? 'text-gray-400' : 'text-gray-500',
            header: isDarkMode ? 'bg-[#151b28] border-b border-gray-800' : 'bg-[#1e2532]',
            sidebar: isDarkMode ? 'bg-[#151b28] border-r border-gray-800' : 'bg-white border-r border-gray-100',
            card: isDarkMode ? 'bg-[#1a2130] border-gray-800 shadow-none' : 'bg-white border-gray-100 shadow-sm',
            searchBg: isDarkMode ? 'bg-[#0f141e]' : 'bg-[#f4ecec]',
            hover: isDarkMode ? 'hover:bg-white/5' : 'hover:bg-gray-50',
            border: isDarkMode ? 'border-gray-800' : 'border-gray-200',
            studioBg: isDarkMode ? 'from-gray-900 via-gray-800 to-[#1a2130]' : 'from-gray-100 via-gray-200 to-white'
          };

          const filters = ['Todos', 'Alertas IA', 'Performance', 'Sensores', 'Manutenção'];

          // ── Mock fallback data ──────────────────────────────────────────────

          const mockAlertVehicles = [
            { id: 'L-204', placa: 'XYZ-9876', status: 'critical', type: 'car', driver: 'Ana Paula', title: 'Desgaste Prematuro: Pastilhas', desc: 'IA estima falha nos freios nos próximos 50km.' },
            { id: 'L-105', placa: 'ABC-1234', status: 'warning', type: 'car', driver: 'João Marcos', title: 'Pressão de Pneus Baixa', desc: 'Pneu traseiro direito com 24 PSI. Risco de furo.' },
            { id: 'L-1042', placa: 'QWE-5555', status: 'critical', type: 'car', driver: 'Carlos Silva', title: 'Aquecimento do Motor', desc: 'Temperatura excedeu limite seguro em subida.' }
          ];

          const mockFleetDrivers = [
            { id: '1', name: 'Carlos Silva', status: 'em_rota', time: '14 min', placa: 'XYZ-9876', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=Carlos&backgroundColor=e2e8f0', carColor: '#3b82f6', phone: '(11) 98888-7777', email: 'carlos.s@zerith.com', model: 'Tracker 2023' },
            { id: '2', name: 'Ana Paula', status: 'em_rota', time: '5 min', placa: 'ABC-1234', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=Ana&backgroundColor=e2e8f0', carColor: '#ef4444', phone: '(11) 97777-6666', email: 'ana.p@zerith.com', model: 'Nivus 2024' },
            { id: '3', name: 'João Marcos', status: 'disponivel', time: '-', placa: 'QWE-5555', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=Joao&backgroundColor=e2e8f0', carColor: '#10b981', phone: '(11) 96666-5555', email: 'joao.m@zerith.com', model: 'Corolla 2022' },
            { id: '4', name: 'Mariana Costa', status: 'disponivel', time: '-', placa: 'RTY-1122', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=Mariana&backgroundColor=e2e8f0', carColor: '#f59e0b', phone: '(11) 95555-4444', email: 'mariana.c@zerith.com', model: 'Kicks 2023' },
            { id: '5', name: 'Ricardo Dias', status: 'manutencao', time: '-', placa: 'UIO-9988', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=Ricardo&backgroundColor=e2e8f0', carColor: '#64748b', phone: '(11) 94444-3333', email: 'ricardo.d@zerith.com', model: 'Compass 2022' },
            { id: '6', name: 'Fernanda Lima', status: 'disponivel', time: '-', placa: 'BNM-5544', avatar: 'https://api.dicebear.com/7.x/notionists/svg?seed=Fernanda&backgroundColor=e2e8f0', carColor: '#a855f7', phone: '(11) 93333-2222', email: 'fernanda.l@zerith.com', model: 'Creta 2024' },
          ];

          const aiPredictions = [
            { placa: 'RTY-1122', id: 'L-301', issue: 'Falha no Alternador Prevista', prob: 88, timeframe: 'em ~2.500 km', icon: <Icon name="lightning" /> },
            { placa: 'UIO-9988', id: 'L-302', issue: 'Vazamento de Fluido (Transmissão)', prob: 72, timeframe: 'em ~4.000 km', icon: <Icon name="pulse" /> },
            { placa: 'BNM-5544', id: 'L-305', issue: 'Desgaste Irregular de Pneus', prob: 65, timeframe: 'em ~6.500 km', icon: <Icon name="gauge" /> },
          ];

          // ── API data mapping ────────────────────────────────────────────────

          const CAR_COLORS = ['#3b82f6','#ef4444','#10b981','#f59e0b','#64748b','#a855f7','#ec4899','#06b6d4'];

          const displayVehicles = apiVehicles.length > 0
            ? apiVehicles.map(v => ({
                id: v.apelido || v.placa,
                placa: v.placa,
                status: v.status === 'MANUTENCAO' ? 'warning' : v.status === 'INATIVO' ? 'critical' : 'ok',
                type: 'car',
                driver: `${v.marca} ${v.modelo}`,
                title: v.status === 'MANUTENCAO' ? 'Veículo em Manutenção'
                     : v.status === 'INATIVO'    ? 'Veículo Inativo'
                     : 'Operando Normalmente',
                desc: `${v.modelo} ${v.ano} · Odômetro: ${v.odometroKm.toLocaleString('pt-BR')} km`,
              }))
            : mockAlertVehicles;

          const displayDrivers = apiVehicles.length > 0
            ? apiVehicles.map((v, i) => ({
                id: v.id,
                name: v.apelido || `${v.marca} ${v.modelo}`,
                status: v.status === 'MANUTENCAO' ? 'manutencao' : v.status === 'ATIVO' ? 'em_rota' : 'disponivel',
                time: v.status === 'ATIVO' ? '–' : '-',
                placa: v.placa,
                avatar: `https://api.dicebear.com/7.x/notionists/svg?seed=${encodeURIComponent(v.placa)}&backgroundColor=e2e8f0`,
                carColor: CAR_COLORS[i % CAR_COLORS.length],
                phone: '–',
                email: `${v.placa.toLowerCase()}@zerith.com`,
                model: `${v.marca} ${v.modelo} ${v.ano}`,
              }))
            : mockFleetDrivers;

          const safeIndex = displayVehicles.length > 0 ? carouselIndex % displayVehicles.length : 0;
          const currentAlert = displayVehicles[safeIndex] || displayVehicles[0];

          const nextCarouselItem = (e) => { e.stopPropagation(); setCarouselIndex(p => (p + 1) % displayVehicles.length); };
          const prevCarouselItem = (e) => { e.stopPropagation(); setCarouselIndex(p => p === 0 ? displayVehicles.length - 1 : p - 1); };

          const onRouteCount   = displayDrivers.filter(d => d.status === 'em_rota').length;
          const availableCount = displayDrivers.filter(d => d.status === 'disponivel').length;

          // ── Telemetry ──────────────────────────────────────────────────────

          const motorTemp = telemetryData?.temperaturaMotorC;
          const fuelLevel = telemetryData?.nivelCombustivelPct;
          const tempStatus = motorTemp == null ? 'NORMAL'
            : motorTemp > 110 ? 'CRÍTICO'
            : motorTemp > 95  ? 'ATENÇÃO'
            : 'NORMAL';

          const tempBadgeClass = tempStatus === 'CRÍTICO'
            ? 'bg-red-500/10 text-red-500'
            : tempStatus === 'ATENÇÃO'
            ? 'bg-yellow-500/10 text-yellow-500'
            : 'bg-green-500/10 text-green-500';

          const fuelBadgeClass = fuelLevel != null && fuelLevel < 20
            ? 'bg-red-500/10 text-red-500'
            : fuelLevel != null && fuelLevel < 40
            ? 'bg-yellow-500/10 text-yellow-500'
            : 'bg-blue-500/10 text-blue-500';

          const fuelBadgeText = fuelLevel != null && fuelLevel < 20 ? 'BAIXO'
            : fuelLevel != null && fuelLevel < 40 ? 'ATENÇÃO'
            : 'OTIMIZADO';

          // ── Conditional renders ────────────────────────────────────────────

          if (authState === 'loading') return <LoadingScreen />;
          if (authState === 'unauthenticated') return <LoginScreen onLogin={handleLogin} />;

          return (
            <div className={`min-h-screen ${theme.bg} ${theme.textMain} font-sans transition-colors duration-300 flex flex-col`}>

              {/* HEADER */}
              <header className={`sticky top-0 z-50 flex items-center justify-between px-6 py-3 ${theme.header} text-white shadow-md transition-colors duration-300`}>
                <div className="flex items-center gap-6 min-w-[200px]">
                  <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="hover:bg-white/10 p-2 rounded-lg transition-colors">
                    <Icon name="list" size={24} className="w-6 h-6" />
                  </button>
                  <img
                    src="NOME ZERITH.png"
                    alt="ZERITH"
                    className="h-6 object-contain mt-1"
                    onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }}
                  />
                  <span className="hidden text-[22px] font-light tracking-[0.25em] mt-1 text-white select-none">ZERITH</span>
                </div>

                <div className="flex-1 max-w-2xl px-8 relative">
                  <div className={`relative flex items-center ${theme.searchBg} rounded-full transition-all duration-300 ${isSearchFocused ? 'ring-2 ring-blue-400 shadow-lg' : 'shadow-inner'}`}>
                    <Icon name="magnifying-glass" size={16} className="text-gray-500 ml-5" />
                    <input type="text" placeholder="Buscar placa, motorista ou relatório..." onFocus={() => setIsSearchFocused(true)} onBlur={() => setTimeout(() => setIsSearchFocused(false), 200)} className={`w-full bg-transparent ${isDarkMode ? 'text-white' : 'text-gray-700'} placeholder-gray-500 py-2.5 px-4 text-sm focus:outline-none`} />
                    <button className="pr-5 text-gray-500 hover:text-blue-500 transition-colors" title="Filtros avançados">
                      <Icon name="sliders-horizontal" size={16} />
                    </button>
                  </div>
                </div>

                <div className="flex items-center gap-4 min-w-[200px] justify-end">
                  <div className="relative">
                    <button onClick={() => setIsNotifOpen(!isNotifOpen)} className="hover:bg-white/10 p-2 rounded-full transition-colors relative">
                      <Icon name="bell" size={20} />
                      <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-[#1e2532] animate-pulse"></span>
                    </button>
                    {isNotifOpen && (
                      <div className={`absolute right-0 mt-3 w-80 ${theme.card} rounded-[1.5rem] shadow-xl border ${theme.border} py-2 z-50 animate-in fade-in slide-in-from-top-2`}>
                        <div className={`px-4 py-3 border-b ${theme.border} flex justify-between items-center mb-1`}><h3 className={`text-[10px] font-bold ${theme.textMuted} uppercase tracking-wider`}>Notificações</h3><span className="text-[10px] bg-red-500/10 text-red-500 px-2 py-0.5 rounded-full font-bold">Ação Exigida</span></div>
                        <div className="max-h-80 overflow-y-auto">
                          <button onClick={() => { setSelectedVehicle(displayVehicles[0]); setIsNotifOpen(false); setCurrentView('dashboard'); setActiveFilter('Alertas IA'); }} className={`w-full text-left flex items-start gap-3 px-4 py-3 ${theme.hover} transition-colors border-l-2 border-red-500 bg-red-500/5`}>
                            <div className="mt-1"><span className="flex h-2 w-2 relative"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span></span></div>
                            <div><p className="text-xs font-bold text-red-500 mb-0.5">Atenção Imediata: {displayVehicles[0]?.id || 'L-204'}</p><p className={`text-xs ${theme.textMuted}`}>{displayVehicles[0]?.title || 'Falha iminente detectada.'}</p><p className={`text-[10px] ${theme.textMuted} mt-1 font-medium`}>AGORA</p></div>
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="w-px h-6 bg-gray-600/50 mx-1"></div>
                  <div className="relative">
                    <button onClick={() => setIsUserMenuOpen(!isUserMenuOpen)} className="flex items-center gap-2 hover:bg-white/10 p-1 pr-2.5 rounded-full transition-colors focus:outline-none">
                      <div className="w-7 h-7 bg-gradient-to-tr from-gray-500 to-gray-400 rounded-full flex items-center justify-center">
                        <i className="ph ph-user text-white" style={{fontSize: 16}}></i>
                      </div>
                      <Icon name="caret-down" size={14} className={`text-gray-400 transition-transform duration-300 ${isUserMenuOpen ? 'rotate-180' : ''}`} />
                    </button>
                    {isUserMenuOpen && (
                      <div className={`absolute right-0 mt-3 w-56 ${theme.card} rounded-2xl shadow-xl border ${theme.border} py-2 z-30`}>
                        <div className={`px-4 py-3 border-b ${theme.border} mb-1`}>
                          <p className={`text-sm font-medium ${theme.textMain}`}>{currentUser?.nome || 'Administrador'}</p>
                          <p className={`text-xs ${theme.textMuted}`}>{currentUser?.email || ''}</p>
                        </div>
                        <button className={`w-full text-left flex items-center gap-3 px-4 py-2 ${theme.hover} transition-colors`}><Icon name="gear" size={16} className={theme.textMain} /><span className={`text-sm ${theme.textMain}`}>Configurações</span></button>
                        <div className={`h-px ${theme.border} my-1`}></div>
                        <button onClick={handleLogout} className={`w-full text-left flex items-center gap-3 px-4 py-2 ${isDarkMode ? 'hover:bg-red-900/20' : 'hover:bg-red-50'} transition-colors`}><Icon name="sign-out" size={16} className="text-red-500" /><span className="text-sm text-red-500">Sair</span></button>
                      </div>
                    )}
                  </div>
                </div>
              </header>

              {/* MAIN LAYOUT */}
              <main className="max-w-[1500px] mx-auto w-full pt-6 px-6 flex gap-6 flex-1">

                {/* SIDEBAR */}
                <aside className={`hidden md:flex flex-col shrink-0 transition-all duration-300 ease-in-out ${isSidebarOpen ? 'w-[240px]' : 'w-[64px]'}`}>
                  <nav className="sticky top-24 flex flex-col gap-1 flex-1">
                    <NavItem icon={<Icon name="house" />} text="Visão Global" active={currentView === 'dashboard' && ['Todos', 'Performance', 'Sensores'].includes(activeFilter)} onClick={() => { setCurrentView('dashboard'); setActiveFilter('Todos'); }} isOpen={isSidebarOpen} theme={theme} isDarkMode={isDarkMode} />

              {status === 'critical' && (
                <g>
                  <circle cx="104" cy="130" r="32" fill="none" stroke="#ef4444" strokeWidth="2" strokeDasharray="6 6" className="animate-spin-slow" style={{ transformOrigin: '104px 130px' }} />
                  <line x1="104" y1="130" x2="64" y2="50" stroke="#ef4444" strokeWidth="1.5" opacity="0.8"/>
                  <circle cx="64" cy="50" r="5" fill="#ef4444" className="animate-pulse" />
                </g>
              )}
              {status === 'warning' && (
                <g><circle cx="288" cy="130" r="32" fill="none" stroke="#f59e0b" strokeWidth="2" strokeDasharray="6 6" className="animate-spin-slow" style={{ transformOrigin: '288px 130px' }} /></g>
              )}
            </svg>
          );
        };

        // ── VehicleModal ───────────────────────────────────────────────────────
        const VehicleModal = ({ vehicle, onClose, theme, isDarkMode }) => {
          const [diagState, setDiagState] = useState('idle');
          const [progress, setProgress] = useState(0);
          const [diagStep, setDiagStep] = useState(0);

          const isOk = vehicle.status === 'ok' || vehicle.status === 'active';
          const statusText = isOk ? 'OPERAÇÃO NORMAL' : (vehicle.status === 'warning' ? 'VERIFICAR SISTEMA' : 'AÇÃO NECESSÁRIA');

          const diagSteps = [
            "Iniciando handshake OBD-II...",
            "Analisando telemetria de sensores...",
            "Buscando anomalias no padrão do motor...",
            "Cruzando dados com IA na nuvem...",
            "Consolidando relatório de diagnóstico..."
          ];

          React.useEffect(() => {
            let interval;
            if (diagState === 'running') {
              interval = setInterval(() => {
                setProgress((old) => {
                  if (old >= 100) { clearInterval(interval); setDiagState('completed'); return 100; }
                  if (old === 20) setDiagStep(1);
                  if (old === 40) setDiagStep(2);
                  if (old === 60) setDiagStep(3);
                  if (old === 80) setDiagStep(4);
                  return old + 2;
                });
              }, 60);
            }
            return () => clearInterval(interval);
          }, [diagState]);

          const startDiagnosis = (e) => { e.stopPropagation(); setDiagState('running'); setProgress(0); setDiagStep(0); };

          return (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-200" onClick={onClose}>
              <div className={`${theme.card} w-full max-w-[420px] h-[700px] rounded-[2.5rem] shadow-2xl relative overflow-hidden flex flex-col animate-in zoom-in-95 duration-300`} onClick={e => e.stopPropagation()}>
                <div className={`absolute top-0 left-0 w-full h-[55%] bg-gradient-to-b ${theme.studioBg} flex flex-col items-center justify-center`}>
                  <div className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 ${isDarkMode ? 'bg-blue-500/5' : 'bg-white/60'} rounded-full blur-[50px] opacity-70`}></div>
                  <div className="w-[90%] max-w-[320px] max-h-[240px] relative z-10 flex items-center justify-center">
                    <VehicleBlueprint status={vehicle.status} isDarkMode={isDarkMode} isScanning={diagState === 'running'} />
                  </div>
                </div>
                <div className="px-6 py-6 flex justify-between items-start z-20 relative">
                  <div className={`px-3 py-1.5 rounded-full text-[10px] font-bold tracking-widest flex items-center gap-2 shadow-sm ${isOk ? 'bg-green-500/10 text-green-500 border border-green-500/20' : (vehicle.status === 'warning' ? 'bg-yellow-500/10 text-yellow-500 border border-yellow-500/20' : 'bg-red-500/10 text-red-500 border border-red-500/20')}`}>
                    <div className={`w-1.5 h-1.5 rounded-full ${isOk ? 'bg-green-500' : (vehicle.status === 'warning' ? 'bg-yellow-500' : 'bg-red-500 animate-ping')}`}></div>
                    {statusText}
                  </div>
                  <button onClick={onClose} className={`p-2 rounded-full ${isDarkMode ? 'bg-gray-800/50 hover:bg-gray-700' : 'bg-black/5 hover:bg-black/10'} transition-colors`}><Icon name="x" size={18} className={theme.textMain} /></button>
                </div>
                <div className="flex-1"></div>
                <div className={`relative z-20 ${theme.card} rounded-t-[2.5rem] pt-8 px-8 pb-8 flex flex-col h-[50%] border-t ${theme.border} shadow-[0_-15px_40px_rgba(0,0,0,0.05)]`}>
                  <div className={`w-12 h-1 ${isDarkMode ? 'bg-gray-700' : 'bg-gray-200'} rounded-full absolute top-4 left-1/2 -translate-x-1/2`}></div>
                  <div className="mt-0 mb-5">
                    <h2 className={`text-3xl font-light ${theme.textMain} tracking-tight`}>{vehicle.id}</h2>
                    <p className={`text-xs ${theme.textMuted} font-medium mt-1`}>Placa: {vehicle.placa || 'N/A'} · {vehicle.driver || 'Sem motorista'}</p>
                  </div>

                  {diagState === 'idle' && (
                    <div className={`rounded-2xl p-4 text-left flex gap-4 items-center mb-auto border ${isOk ? (isDarkMode ? 'bg-green-950/20 border-green-900/30' : 'bg-green-50 border-green-100') : (vehicle.status === 'warning' ? (isDarkMode ? 'bg-yellow-950/20 border-yellow-900/30' : 'bg-yellow-50 border-yellow-100') : (isDarkMode ? 'bg-red-950/20 border-red-900/30' : 'bg-red-50 border-red-100'))}`}>
                      <div className={`p-3 rounded-full ${isOk ? 'bg-green-100/10 text-green-500' : (vehicle.status === 'warning' ? 'bg-yellow-100/10 text-yellow-500' : 'bg-red-100/10 text-red-500')}`}>
                        {isOk ? <Icon name="check-circle" size={24} /> : (vehicle.status === 'warning' ? <Icon name="pulse" size={24} /> : <Icon name="wrench" size={24} />)}
                      </div>
                      <div>
                        <p className={`font-medium text-sm ${isOk ? 'text-green-500' : (vehicle.status === 'warning' ? 'text-yellow-500' : 'text-red-500')}`}>{isOk ? 'Todos os sistemas normais' : (vehicle.status === 'warning' ? vehicle.title || 'Atenção ao sistema' : vehicle.title || 'Problema Detectado')}</p>
                        <p className={`text-xs mt-1 ${theme.textMuted}`}>{vehicle.desc || (isOk ? 'Veículo operando na rota com segurança.' : 'Verificação recomendada.')}</p>
                      </div>
                    </div>
                  )}

                  {diagState === 'running' && (
                    <div className="flex flex-col justify-center mb-auto h-full w-full px-2">
                      <div className="flex justify-between items-center mb-3">
                        <span className={`text-[10px] font-bold uppercase tracking-wider ${theme.textMuted}`}>{diagSteps[diagStep]}</span>
                        <span className={`text-xs font-bold ${isDarkMode ? 'text-blue-400' : 'text-blue-600'}`}>{progress}%</span>
                      </div>
                      <div className={`h-2.5 w-full ${isDarkMode ? 'bg-gray-800' : 'bg-gray-200'} rounded-full overflow-hidden`}>
                        <div className="h-full bg-blue-500 rounded-full transition-all duration-75" style={{ width: `${progress}%` }}></div>
                      </div>
                    </div>
                  )}

                  {diagState === 'completed' && (
                    <div className="flex flex-col gap-3 mb-auto animate-in fade-in zoom-in-95 duration-300 w-full">
                      <div className={`p-4 rounded-2xl border ${isDarkMode ? 'bg-green-900/10 border-green-900/30' : 'bg-green-50 border-green-100'} flex items-start gap-3`}>
                        <Icon name="check-circle" size={18} className="text-green-500 mt-0.5 shrink-0" />
                        <div>
                          <p className={`text-sm font-bold ${isDarkMode ? 'text-green-400' : 'text-green-700'}`}>Diagnóstico Preditivo Concluído</p>
                          <p className={`text-[11px] ${theme.textMuted} mt-1 leading-relaxed`}>
                            {vehicle.status === 'critical' ? 'Confirmação de anomalia detectada. Probabilidade de falha: 98.4%. O.S. recomendada.' : 'Sistema verificado. Dados enviados para o histórico da frota.'}
                          </p>
                        </div>
                      </div>
                    </div>
                  )}

                  {diagState === 'idle' && (
                    <button onClick={startDiagnosis} className={`w-full h-12 rounded-full font-medium text-xs tracking-wider transition-all flex items-center justify-center gap-2 group/btn ${isOk ? (isDarkMode ? 'bg-gray-800 text-gray-300 hover:bg-gray-700' : 'bg-gray-100 text-gray-700 hover:bg-gray-200') : (isDarkMode ? 'bg-blue-600 text-white hover:bg-blue-500' : 'bg-[#1e2532] text-white hover:bg-black')}`}>
                      {isOk ? 'VER HISTÓRICO DA ROTA' : <React.Fragment><Icon name="pulse" size={16} />{vehicle.status === 'warning' ? 'AGENDAR REVISÃO' : 'INICIAR DIAGNÓSTICO'}</React.Fragment>}
                    </button>
                  )}

                  {diagState === 'running' && (
                    <button disabled className={`w-full h-12 rounded-full font-medium text-xs tracking-wider flex items-center justify-center gap-2 ${isDarkMode ? 'bg-gray-800 text-gray-500' : 'bg-gray-100 text-gray-400'} cursor-not-allowed`}>
                      <Icon name="pulse" size={16} className="animate-spin" /> PROCESSANDO...
                    </button>
                  )}

                  {diagState === 'completed' && (
                    <button onClick={onClose} className={`w-full h-12 rounded-full font-bold text-xs tracking-wider transition-all flex items-center justify-center gap-2 ${vehicle.status === 'critical' ? (isDarkMode ? 'bg-red-600/20 text-red-400 border border-red-500/30 hover:bg-red-600/30' : 'bg-red-50 text-red-600 border border-red-100 hover:bg-red-100') : (isDarkMode ? 'bg-gray-800 text-gray-300 hover:bg-gray-700' : 'bg-gray-100 text-gray-700 hover:bg-gray-200')}`}>
                      {vehicle.status === 'critical' ? <React.Fragment><Icon name="calendar" size={16} /> GERAR ORDEM DE SERVIÇO (O.S.)</React.Fragment> : 'FECHAR E RETORNAR'}
                    </button>
                  )}
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
