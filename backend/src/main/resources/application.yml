# ================================================================
# ZERITH Backend — Configuração Principal
# ================================================================
spring:
  application:
    name: zerith-backend

  # Perfil ativo padrão (sobrescrito por variável de ambiente no Render)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway cuida do schema — nunca deixar create/update em prod
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Actuator — health check para o Render
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Porta padrão
server:
  port: ${PORT:8080}

---
# ================================================================
# PERFIL: dev (Neon via .env local)
# ================================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5          # Neon free tier tem limite de conexões
      minimum-idle: 1
      idle-timeout: 300000
      connection-test-query: SELECT 1

  jpa:
    show-sql: true                  # Apenas em dev

logging:
  level:
    dev.zerith: DEBUG
    org.springframework.security: DEBUG

---
# ================================================================
# PERFIL: prod (Render — variáveis de ambiente injetadas)
# ================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-test-query: SELECT 1

  jpa:
    show-sql: false

logging:
  level:
    dev.zerith: INFO
    root: WARN
