# ================================================================
# ZERITH Backend — Configuração Principal
# ================================================================
spring:
  application:
    name: zerith-backend

  # Perfil ativo padrão (sobrescrito por variável de ambiente no Render)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway cuida do schema — nunca deixar create/update em prod
    show-sql: false
    open-in-view: false           # Evita queries durante view rendering
    properties:
      hibernate:
        format_sql: true
        # dialect detectado automaticamente — não especificar explicitamente

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT
zerith:
  jwt:
    secret: ${JWT_SECRET:zerith-dev-secret-key-insecure-do-not-use-in-production-env}
    expiration: 86400000  # 24h em milissegundos

# Actuator — health check para o Render
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Porta padrão
server:
  port: ${PORT:8080}

---
# ================================================================
# PERFIL: dev (Neon via .env local — usa DATABASE_URL composta)
# ================================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5          # Neon free tier tem limite de conexões
      minimum-idle: 1
      idle-timeout: 300000
      connection-test-query: SELECT 1

  jpa:
    show-sql: true                  # Apenas em dev
    open-in-view: false

# CORS — origens permitidas em dev
zerith:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173

logging:
  level:
    dev.zerith: DEBUG
    org.springframework.security: DEBUG

---
# ================================================================
# PERFIL: prod (Render — 5 variáveis de ambiente separadas)
# DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# ================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-test-query: SELECT 1

  jpa:
    show-sql: false
    open-in-view: false

  # Desabilita senha gerada automaticamente em prod
  # A SecurityConfig.java cuida da autenticação
  security:
    user:
      name: disabled
      password: disabled

# CORS — origens permitidas em prod (GitHub Pages + domínio futuro)
# Sobrescrito pela variável ZERITH_CORS_ALLOWED_ORIGINS no Render
zerith:
  cors:
    allowed-origins: ${ZERITH_CORS_ALLOWED_ORIGINS:https://italoantonio-dev.github.io}

logging:
  level:
    dev.zerith: INFO
    root: WARN
